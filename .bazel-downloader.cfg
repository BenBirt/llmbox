# Bazel experimental downloader config
# Redirects crates.io downloads to local .crate-cache directory.
# See: https://bazel.build/reference/command-line-reference#flag--experimental_downloader_config

rewrite https://static\.crates\.io/crates/([^/]+)/([^/]+)/download file:///home/user/llmbox/.crate-cache/$1-$2.crate
